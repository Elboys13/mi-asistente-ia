<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WikiBot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button id="menu-toggle" class="btn-menu">☰</button>

    <div class="contenedor-principal">
        
        <aside class="barra-lateral" id="barra-lateral">
            <div class="header-sidebar">
                <button id="nueva-seccion" class="btn-nuevo">+ Nueva Conversación</button>
            </div>
            <div id="lista-secciones" class="lista-secciones"></div>
        </aside>

        <main class="chat-area">
            <section id="pantalla" class="pantalla-mensajes"></section>

            <footer class="entrada-area">
                <div class="input-container">
                    <input type="text" id="entrada-usuario" placeholder="Pregunta algo..." autocomplete="off">
                    
                    <div class="botones-derecha">
                        <button id="btn-detener" class="btn-stop">Detener</button>
                        <button id="botonEnviar" class="btn-enviar">Enviar</button>
                    </div>
                </div>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
